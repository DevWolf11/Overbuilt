<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Overbuilt, "The Stack" (polished): a tank, a car, a jet, a helicopter and a rocket piled into one wobbly tower,
       the rocket already lifting off the top. Overbuilt, literally: built too high. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c3f6a"/>
      <stop offset="0.6" stop-color="#0e2240"/>
      <stop offset="1" stop-color="#070c18"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6dc7c"/><stop offset="1" stop-color="#5f9c3a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e2423d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd47e"/><stop offset="0.5" stop-color="#ffb547"/><stop offset="1" stop-color="#e58e14"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c3cf"/>
    </linearGradient>
    <linearGradient id="whiteV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3ccd7"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#aab5c2"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e9ee"/><stop offset="1" stop-color="#8994a2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f1ff"/><stop offset="1" stop-color="#3aa6e0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/><stop offset="0.35" stop-color="#ffb547"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g clip-path="url(#card)" fill="none" stroke="#7fdcff">
    <path stroke-opacity="0.05" stroke-width="2" d="M32 0v512M96 0v512M160 0v512M224 0v512M288 0v512M352 0v512M416 0v512M480 0v512M0 32h512M0 96h512M0 160h512M0 224h512M0 288h512M0 352h512M0 416h512M0 480h512"/>
    <path stroke-opacity="0.12" stroke-width="2" d="M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512"/>
  </g>
  <ellipse cx="250" cy="484" rx="196" ry="11" fill="#000" fill-opacity="0.45"/>

  <g stroke="#0a0f18" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1. tank (bottom), facing right -->
    <g transform="translate(246 482) scale(0.98)">
      <rect x="-134" y="-52" width="268" height="52" rx="26" fill="#46515f"/>
      <g fill="url(#steel)"><circle cx="-106" cy="-26" r="17"/><circle cx="-53" cy="-26" r="17"/><circle cx="0" cy="-26" r="17"/><circle cx="53" cy="-26" r="17"/><circle cx="106" cy="-26" r="17"/></g>
      <path d="M-142-46V-76l14-14H92l54 26v18z" fill="url(#green)"/>
      <rect x="58" y="-118" width="122" height="14" rx="3" fill="url(#steel)"/>
      <rect x="168" y="-123" width="20" height="24" rx="4" fill="#9aa5b3"/>
      <path d="M-66-90l6-24q2-10 12-10h80l32 18 2 16z" fill="#5f9c3a"/>
      <g fill="#0a0f18" stroke="none"><circle cx="-115" cy="-66" r="5"/><circle cx="-84" cy="-66" r="5"/><circle cx="-53" cy="-66" r="5"/><circle cx="-22" cy="-66" r="5"/><circle cx="9" cy="-66" r="5"/><circle cx="40" cy="-66" r="5"/><circle cx="71" cy="-66" r="5"/></g>
    </g>
    <!-- 2. car on the turret -->
    <g transform="translate(256 366) rotate(-5) scale(0.95)">
      <circle cx="-62" cy="-22" r="22" fill="#1f262f"/><circle cx="62" cy="-22" r="22" fill="#1f262f"/>
      <path d="M-104-28v-24q0-8 10-10l42-4 26-30h62l30 30 34 6q10 2 10 12v20z" fill="url(#red)"/>
      <path d="M-34-66l18-22h22v22zM20-88h20l22 22H20z" fill="url(#glass)" stroke-width="7"/>
      <circle cx="-62" cy="-22" r="9" fill="url(#steel)" stroke-width="6"/><circle cx="62" cy="-22" r="9" fill="url(#steel)" stroke-width="6"/>
    </g>
    <!-- 3. jet balanced on the car's roof, facing left -->
    <g transform="translate(250 291) rotate(6) scale(0.92)">
      <path d="M22-26H-30L-2 4h44z" fill="url(#steel)" stroke-width="7"/>
      <path d="M118-12 126-50H-70q-52 0-78 19 26 19 78 19z" fill="url(#white)"/>
      <path d="M126-50 116-96H92L54-50z" fill="url(#red)"/>
      <path d="M-62-44q22-22 52-2z" fill="url(#glass)" stroke-width="6"/>
    </g>
    <!-- 4. helicopter on the jet -->
    <g transform="translate(262 251) rotate(-7) scale(0.92)">
      <path d="M-40-4H58M-24-4V-14M40-4V-14" fill="none" stroke-width="8"/>
      <path d="M-50-40H-156l-8-28h12l18 14H-50z" fill="url(#amber)"/>
      <path d="M-34-14q-22 0-22-26 0-30 40-30h22q40 0 50 30 4 26-22 26z" fill="url(#amber)"/>
      <path d="M16-68q26 4 34 28H16z" fill="url(#glass)" stroke-width="7"/>
      <path d="M0-70v-18" fill="none" stroke-width="10"/>
      <path d="M-134-94h268" fill="none" stroke-width="24"/>
      <path d="M-134-94h268" fill="none" stroke="#f2f5f8" stroke-width="9"/>
      <g fill="#ff5d5d" stroke="none"><rect x="-134" y="-98" width="18" height="8"/><rect x="116" y="-98" width="18" height="8"/></g>
    </g>
  </g>
  <!-- 5. the rocket, lifting off the top -->
  <g transform="translate(252 139) rotate(9) scale(0.86) translate(-256 -170)">
    <ellipse cx="256" cy="196" rx="30" ry="36" fill="#ffb547" fill-opacity="0.22"/>
    <path d="M240 168h32l-4 24-12 34-12-34z" fill="url(#flame)"/>
    <path d="M210 74v40M302 74v40M196 104v26M316 104v26" stroke="#bfe9ff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#0a0f18" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M236 116l-22 18v28l22-12zM276 116l22 18v28l-22-12z" fill="url(#red)"/>
      <path d="M236 160V84q0-28 20-48 20 20 20 48v76z" fill="url(#whiteV)"/>
      <path d="M241 66q5-18 15-30 10 12 15 30z" fill="url(#red)" stroke-width="7"/>
      <path d="M244 160h24l4 10h-32z" fill="#6f7a88" stroke-width="6"/>
    </g>
    <circle cx="256" cy="98" r="6" fill="#0a0f18"/>
  </g>
</svg>
