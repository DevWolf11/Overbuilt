<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Overbuilt's browser-tab icon: "The Stack" cut down to what reads at 16-32 px: a tank, a car on it and a rocket lifting off the top -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1c3f6a"/><stop offset="0.6" stop-color="#0e2240"/><stop offset="1" stop-color="#070c18"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.4" stop-color="#ffb547"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g stroke="#0a0f18" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- tank -->
    <rect x="48" y="404" width="404" height="72" rx="36" fill="#46515f"/>
    <g fill="#c9d1da"><circle cx="112" cy="440" r="20"/><circle cx="196" cy="440" r="20"/><circle cx="280" cy="440" r="20"/><circle cx="364" cy="440" r="20"/></g>
    <path d="M40 404V364l18-18h318l70 34v24z" fill="#7cc04d"/>
    <path d="M150 346l8-34q3-12 15-12h104l40 22 2 24z" fill="#5f9c3a"/>
    <rect x="300" y="300" width="176" height="22" rx="5" fill="#c9d1da"/>
    <!-- car -->
    <g transform="translate(250 300) rotate(-5) scale(0.8) translate(-251 -320)">
      <circle cx="160" cy="292" r="28" fill="#1f262f"/><circle cx="330" cy="292" r="28" fill="#1f262f"/>
      <path d="M100 286v-34q0-12 14-14l58-6 36-40h88l42 40 44 8q14 3 14 16v30z" fill="#ff5d5d"/>
      <path d="M190 232l26-30h30v30zM268 202h28l30 30h-58z" fill="#8fdcff" stroke-width="12"/>
    </g>
    <!-- rocket -->
    <g transform="translate(6 -26) rotate(9 256 224) translate(256 224) scale(0.84) translate(-256 -224)">
      <path d="M232 162l-36 28v34l36-16zM280 162l36 28v34l-36-16z" fill="#ff5d5d"/>
      <path d="M232 196V86q0-40 24-66 24 26 24 66v110z" fill="#f2f5f8"/>
      <path d="M238 72q6-30 18-52 12 22 18 52z" fill="#ff5d5d" stroke-width="12"/>
    </g>
  </g>
  <path d="M238 200h36l-6 22-12 22-12-22z" fill="url(#flame)" transform="translate(6 -26) rotate(9 256 224) translate(256 224) scale(0.84) translate(-256 -224)"/>
